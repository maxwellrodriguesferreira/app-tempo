# ==============================================================================
# WEATHER HUB / CLIMASTACK - ARQUITETURA DE CONTAINER ÚNICO
# ==============================================================================
# Execução da aplicação completa (Frontend React + Backend Hono) em um único
# container Docker sem múltiplos serviços, sem Nginx e sem bancos locais.
# ==============================================================================

services:
  weather-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: maxwellrodriguesferreira/weather-hub:latest
    container_name: weather-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/v1/health || exit 1" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
